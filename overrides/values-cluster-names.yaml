---
# DR cluster names, versions, regions, and BYOC.
# RDR is the regionaldr-with-virt Argo app (see values-hub.yaml).
# Set byoc: true when using redeploy.sh parallel 3-cluster + BYOC (kubeconfigs in Vault / values-secret).

costManagement:
  ownerTag: your-user-or-team
  launchedByTag: automation-user
  environmentTag: dev

# Top-level BYOC flag required by the chart ($.Values.byoc).
byoc: true

clusterOverrides:
  primary:
    name: ocp-primary
    version: 4.20.6
    byoc: true
    install_config:
      metadata:
        name: ocp-primary
      compute:
        - name: worker
          replicas: 3
          platform:
            aws:
              type: m8i.4xlarge
      platform:
        aws:
          region: eu-central-1
  secondary:
    name: ocp-secondary
    version: 4.20.6
    byoc: true
    install_config:
      metadata:
        name: ocp-secondary
      compute:
        - name: worker
          replicas: 3
          platform:
            aws:
              type: m8i.4xlarge
      platform:
        aws:
          region: eu-west-1

drpc:
  preferredCluster: ocp-primary
